<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NETO Inventario - Sistema Completo</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NETO Inventario">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <!-- ESTILOS Y DEMÁS CÓDIGO (igual que antes) -->
    <!-- ... (todo el CSS y HTML se mantiene igual) ... -->
    
    <script>
    // ============================================
    // FUNCIÓN MEJORADA PARA LEER CÓDIGO DE BARRAS
    // ============================================
    window.leerCodigoBarras = function(imagenDataURL, callback) {
        // Verificar que Quagga esté disponible
        if (typeof Quagga === 'undefined') {
            callback('❌ Quagga no está cargado', null);
            return;
        }

        try {
            // Crear una imagen para verificar que se puede cargar
            var img = new Image();
            img.onload = function() {
                // Crear un canvas para procesar la imagen
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                
                // Redimensionar para mejor procesamiento
                var maxSize = 800;
                var width = img.width;
                var height = img.height;
                
                if (width > height && width > maxSize) {
                    height = Math.round(height * maxSize / width);
                    width = maxSize;
                } else if (height > maxSize) {
                    width = Math.round(width * maxSize / height);
                    height = maxSize;
                }
                
                canvas.width = width;
                canvas.height = height;
                
                // Dibujar imagen en el canvas
                ctx.drawImage(img, 0, 0, width, height);
                
                // Obtener datos de imagen para mejorar contraste
                var imageData = ctx.getImageData(0, 0, width, height);
                var data = imageData.data;
                
                // Mejorar contraste para códigos de barras
                for (var i = 0; i < data.length; i += 4) {
                    var gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                    // Aumentar contraste
                    var contrast = 1.5;
                    var newGray = ((gray / 255 - 0.5) * contrast + 0.5) * 255;
                    newGray = Math.max(0, Math.min(255, newGray));
                    data[i] = data[i+1] = data[i+2] = newGray;
                }
                ctx.putImageData(imageData, 0, 0);
                
                var processedDataURL = canvas.toDataURL('image/png');
                
                // Usar Quagga para decodificar
                Quagga.decodeSingle({
                    src: processedDataURL,
                    numOfWorkers: 0,
                    inputStream: {
                        size: 800,
                        singleChannel: true
                    },
                    decoder: {
                        readers: [
                            'code_128_reader',
                            'ean_reader', 
                            'ean_8_reader',
                            'code_39_reader',
                            'code_39_vin_reader',
                            'codabar_reader',
                            'upc_reader',
                            'upc_e_reader',
                            'i2of5_reader'
                        ],
                        multiple: false
                    },
                    locate: true
                }, function(result) {
                    if (result && result.codeResult) {
                        callback(null, result.codeResult.code);
                    } else {
                        // Intentar con la imagen original si falla
                        Quagga.decodeSingle({
                            src: imagenDataURL,
                            numOfWorkers: 0,
                            inputStream: {
                                size: 800,
                                singleChannel: true
                            },
                            decoder: {
                                readers: [
                                    'code_128_reader',
                                    'ean_reader',
                                    'ean_8_reader',
                                    'code_39_reader',
                                    'upc_reader',
                                    'upc_e_reader'
                                ]
                            }
                        }, function(result2) {
                            if (result2 && result2.codeResult) {
                                callback(null, result2.codeResult.code);
                            } else {
                                callback('❌ No se pudo leer el código de barras', null);
                            }
                        });
                    }
                });
            };
            
            img.onerror = function() {
                callback('❌ Error al cargar la imagen', null);
            };
            
            img.src = imagenDataURL;
            
        } catch (error) {
            console.error('Error en lectura:', error);
            callback('❌ Error al procesar la imagen', null);
        }
    };

    // ============================================
    // FUNCIÓN MEJORADA PARA ESCANEAR
    // ============================================
    window.activarEscaneo = function() {
        // Crear input de archivo
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment';
        input.style.display = 'none';
        document.body.appendChild(input);
        
        input.onchange = function(e) {
            var file = e.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    window.mostrarToast('📷 Procesando imagen...', '📷');
                    
                    // Procesar la imagen
                    var imageDataURL = ev.target.result;
                    
                    window.leerCodigoBarras(imageDataURL, function(error, codigo) {
                        if (error) {
                            window.mostrarToast('❌ ' + error, '❌');
                            
                            // Intentar con OCR como fallback
                            window.mostrarToast('📖 Intentando OCR...', '📖');
                            Tesseract.recognize(imageDataURL, 'spa+eng', {
                                logger: function(m) {
                                    if (m.status === 'recognizing text') {
                                        console.log('OCR progreso:', m.progress);
                                    }
                                }
                            }).then(function(result) {
                                var texto = result.data.text;
                                // Buscar números largos (códigos de barras)
                                var numeros = texto.match(/\b\d{6,15}\b/g);
                                if (numeros && numeros.length > 0) {
                                    var codigoEncontrado = numeros[0];
                                    window.mostrarToast('✅ Código por OCR: ' + codigoEncontrado, '✅');
                                    
                                    // Llenar el campo correspondiente
                                    var invInput = document.getElementById('inv-codigo');
                                    if (invInput && document.getElementById('screen-inventario').classList.contains('active')) {
                                        invInput.value = codigoEncontrado;
                                    }
                                    var cadInput = document.getElementById('cad-codigo');
                                    if (cadInput && document.getElementById('screen-caducidades').classList.contains('active')) {
                                        cadInput.value = codigoEncontrado;
                                    }
                                    var ciclicoInput = document.getElementById('ciclico-codigo');
                                    if (ciclicoInput && document.getElementById('screen-ciclicos').classList.contains('active')) {
                                        ciclicoInput.value = codigoEncontrado;
                                    }
                                } else {
                                    window.mostrarToast('❌ No se detectó código en la imagen', '❌');
                                }
                            }).catch(function(err) {
                                console.error('OCR error:', err);
                                window.mostrarToast('❌ Error en OCR', '❌');
                            });
                            return;
                        }
                        
                        // Código detectado correctamente
                        window.mostrarToast('✅ Código: ' + codigo, '✅');
                        
                        // Buscar el campo de entrada activo
                        var invInput = document.getElementById('inv-codigo');
                        if (invInput && document.getElementById('screen-inventario').classList.contains('active')) {
                            invInput.value = codigo;
                            invInput.dispatchEvent(new Event('input'));
                        }
                        
                        var cadInput = document.getElementById('cad-codigo');
                        if (cadInput && document.getElementById('screen-caducidades').classList.contains('active')) {
                            cadInput.value = codigo;
                            cadInput.dispatchEvent(new Event('input'));
                        }
                        
                        var ciclicoInput = document.getElementById('ciclico-codigo');
                        if (ciclicoInput && document.getElementById('screen-ciclicos').classList.contains('active')) {
                            ciclicoInput.value = codigo;
                            ciclicoInput.dispatchEvent(new Event('input'));
                        }
                    });
                };
                reader.readAsDataURL(file);
            } else {
                window.mostrarToast('❌ No se seleccionó imagen', '❌');
            }
            
            // Limpiar el input
            input.value = '';
            document.body.removeChild(input);
        };
        
        // Simular clic para abrir la cámara
        input.click();
    };

    // ============================================
    // FUNCIÓN PARA ESCANEAR EN CADUCIDADES
    // ============================================
    window.activarEscaneoParaCaducidad = function() {
        window.activarEscaneo();
    };

    // ============================================
    // FUNCIÓN DE ENFOQUE PARA INPUT
    // ============================================
    window.enfocarInput = function(id) {
        var input = document.getElementById(id);
        if (input) {
            input.focus();
            input.select();
        }
    };

    // ============================================
    // RESTABLECER FUNCIONES DE PANTALLAS
    // ============================================
    // Asegurar que showScreen funciona correctamente
    var showScreenOriginal = window.showScreen;
    window.showScreen = function(screenId) {
        document.querySelectorAll('.screen').forEach(function(s) {
            s.classList.remove('active');
        });
        var target = document.getElementById('screen-' + screenId);
        if (target) target.classList.add('active');
        window.actualizarBadges();
        window.actualizarVisual();
        if (screenId === 'inventario') window.renderizarInventario();
        if (screenId === 'ciclicos') window.renderizarCiclicos();
        if (screenId === 'aleatorio') window.renderizarAleatorios();
        if (screenId === 'caducidades') window.renderizarCaducidades();
        if (screenId === 'promociones') window.renderizarPromociones();
    };

    // ============================================
    // PRUEBA DE ESCANEO CON TEXTO MANUAL
    // ============================================
    // Permitir ingresar código manualmente en los campos de código
    document.addEventListener('DOMContentLoaded', function() {
        // Permitir que los campos de código acepten entrada manual
        var camposCodigo = ['inv-codigo', 'cad-codigo', 'ciclico-codigo'];
        camposCodigo.forEach(function(id) {
            var input = document.getElementById(id);
            if (input) {
                input.removeAttribute('readonly');
                input.style.cursor = 'text';
                input.style.color = '#ffffff';
                input.placeholder = 'Código manual o escaneado';
            }
        });
        
        console.log('🔍 Sistema de escaneo mejorado');
        console.log('📷 Puedes escanear códigos de barras o ingresarlos manualmente');
    });

    console.log('✅ Sistema actualizado con mejor detección de códigos');
    console.log('📷 Prueba escaneando un código de barras');
    </script>

</body>
</html>
