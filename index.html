    <!-- ============================================ -->
    <!-- CARGA DE LIBRERÍAS PARA PDF (OPTIMIZADO PARA GITHUB PAGES) -->
    <!-- ============================================ -->
    <script>
        // Configuración de CDNs confiables para GitHub Pages
        const CDN = {
            html2canvas: [
                'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'
            ],
            jspdf: [
                'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
            ]
        };

        // Estado de carga
        window.__libreriasCargadas = {
            html2canvas: false,
            jspdf: false
        };

        // Función para cargar un script con fallback
        function cargarScript(urls, nombre) {
            return new Promise((resolve, reject) => {
                let intento = 0;
                function intentarCargar() {
                    if (intento >= urls.length) {
                        console.error(`❌ No se pudo cargar ${nombre} desde ningún CDN`);
                        reject(new Error(`Fallo al cargar ${nombre}`));
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = urls[intento];
                    script.onload = () => {
                        console.log(`✅ ${nombre} cargado desde:`, urls[intento]);
                        resolve();
                    };
                    script.onerror = () => {
                        console.warn(`⚠️ Falló ${nombre} en:`, urls[intento]);
                        intento++;
                        intentarCargar();
                    };
                    document.head.appendChild(script);
                }
                intentarCargar();
            });
        }

        // Cargar ambas librerías en paralelo
        Promise.all([
            cargarScript(CDN.html2canvas, 'html2canvas').then(() => {
                window.__libreriasCargadas.html2canvas = true;
            }),
            cargarScript(CDN.jspdf, 'jspdf').then(() => {
                window.__libreriasCargadas.jspdf = true;
                window.jsPDF = window.jspdf.jsPDF;
            })
        ]).then(() => {
            console.log('✅ Todas las librerías PDF cargadas correctamente');
            window.libreriasPDFListas = true;
            const loader = document.getElementById('loaderStatus');
            if (loader) loader.style.display = 'none';
            if (window.usuarioActual && typeof window.initApp === 'function') {
                window.initApp();
            }
        }).catch((error) => {
            console.error('❌ Error al cargar librerías PDF:', error);
            window.mostrarToast('⚠️ No se pudieron cargar las librerías para PDF. Usa Chrome o Firefox.', '⚠️');
        });
    </script>

    // ============================================

    window.mostrarToast = function(mensaje, icono = 'ℹ️') {
        var container = document.getElementById('toastContainer');
        var message = document.getElementById('toastMessage');
        var icon = document.getElementById('toastIcon');
        message.textContent = mensaje;
        icon.textContent = icono;
        container.classList.add('show');
        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(function() { container.classList.remove('show'); }, 3500);
    };

    // ============================================
    // FUNCIÓN PARA CALCULAR DÍAS RESTANTES
    // ============================================
    window.calcularDiasRestantes = function(fechaCaducidad) {
        if (!fechaCaducidad) return null;
        var hoy = new Date();
        hoy.setHours(0, 0, 0, 0);
        var fecha = new Date(fechaCaducidad);
        fecha.setHours(0, 0, 0, 0);
        var diff = fecha - hoy;
        var dias = Math.ceil(diff / (1000 * 60 * 60 * 24));
        return dias;
    };

    window.obtenerClaseDias = function(dias) {
        if (dias === null || dias === undefined) return 'ok';
        if (dias < 0) return 'rojo';
        if (dias <= 7) return 'rojo';
        if (dias <= 15) return 'naranja';
        if (dias <= 30) return 'amarillo';
        return 'verde';
    };

    window.obtenerEstadoCaducidad = function(dias) {
        if (dias === null || dias === undefined) return { texto: 'Sin fecha', clase: 'ok' };
        if (dias < 0) return { texto: '🚨 CADUCADO', clase: 'critico' };
        if (dias <= 7) return { texto: '⚠️ CRÍTICO', clase: 'critico' };
        if (dias <= 15) return { texto: '⚡ URGENTE', clase: 'urgente' };
        if (dias <= 30) return { texto: '⏳ PRÓXIMO', clase: 'proximo' };
        return { texto: '✅ OK', clase: 'ok' };
    };

    // ============================================
    // FUNCIÓN PARA GENERAR PDF (OPTIMIZADA)
    // ============================================
    window.generarPDF = function(htmlContent, nombreArchivo) {
        return new Promise(function(resolve, reject) {
            try {
                if (typeof window.html2canvas === 'undefined' || typeof window.jsPDF === 'undefined') {
                    window.mostrarToast('⚠️ Librerías PDF no disponibles. Reintentando...', '⏳');
                    setTimeout(function() {
                        window.generarPDF(htmlContent, nombreArchivo).then(resolve).catch(reject);
                    }, 2000);
                    return;
                }

                var pdfContainer = document.getElementById('pdfContent');
                pdfContainer.innerHTML = htmlContent;
                window.mostrarToast('📄 Generando PDF...', '⏳');

                html2canvas(pdfContainer, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    backgroundColor: '#FFFFFF',
                    allowTaint: true,
                    scrollX: 0,
                    scrollY: 0,
                    windowWidth: pdfContainer.scrollWidth,
                    windowHeight: pdfContainer.scrollHeight
                }).then(function(canvas) {
                    var imgData = canvas.toDataURL('image/jpeg', 0.9);
                    var doc = new window.jsPDF('p', 'mm', 'a4');
                    var imgWidth = 190;
                    var imgHeight = (canvas.height * imgWidth) / canvas.width;

                    if (imgHeight > 277) {
                        var pageHeight = 277;
                        var pages = Math.ceil(imgHeight / pageHeight);
                        for (var i = 0; i < pages; i++) {
                            if (i > 0) doc.addPage();
                            var sourceY = (i * pageHeight / imgHeight) * canvas.height;
                            var sourceHeight = Math.min(pageHeight / imgHeight * canvas.height, canvas.height - sourceY);
                            var tempCanvas = document.createElement('canvas');
                            tempCanvas.width = canvas.width;
                            tempCanvas.height = sourceHeight;
                            var ctx = tempCanvas.getContext('2d');
                            ctx.drawImage(canvas, 0, sourceY, canvas.width, sourceHeight, 0, 0, canvas.width, sourceHeight);
                            var tempImgData = tempCanvas.toDataURL('image/jpeg', 0.9);
                            var tempImgWidth = imgWidth;
                            var tempImgHeight = (sourceHeight * tempImgWidth) / canvas.width;
                            doc.addImage(tempImgData, 'JPEG', 10, 10, tempImgWidth, tempImgHeight);
                        }
                    } else {
                        doc.addImage(imgData, 'JPEG', 10, 10, imgWidth, imgHeight);
                    }

                    doc.save(nombreArchivo || 'documento_neto.pdf');
                    pdfContainer.innerHTML = '';
                    window.mostrarToast('📄 PDF generado correctamente', '📄');
                    resolve();
                }).catch(function(err) {
                    console.error('Error en html2canvas:', err);
                    pdfContainer.innerHTML = '';
                    window.mostrarToast('❌ Error al generar PDF: ' + (err.message || 'Desconocido'), '❌');
                    reject(err);
                });
            } catch (e) {
                console.error('Error en generarPDF:', e);
                window.mostrarToast('❌ Error al generar PDF: ' + e.message, '❌');
                reject(e);
            }
        });
    };

    // ============================================
    // FUNCIÓN PARA CARGAR LIBRERÍAS MANUALMENTE
    // ============================================
    window.cargarLibreriasManualmente = function() {
        window.mostrarToast('🔄 Reintentando cargar librerías PDF...', '🔄');
        var loader = document.getElementById('loaderStatus');
        if (loader) loader.style.display = 'block';

        window.__libreriasCargadas = { html2canvas: false, jspdf: false };
        window.libreriasPDFListas = false;

        document.querySelectorAll('script[src*="html2canvas"], script[src*="jspdf"]').forEach(script => {
            script.remove();
        });

        Promise.all([
            cargarScript(CDN.html2canvas, 'html2canvas').then(() => {
                window.__libreriasCargadas.html2canvas = true;
            }),
            cargarScript(CDN.jspdf, 'jspdf').then(() => {
                window.__libreriasCargadas.jspdf = true;
                window.jsPDF = window.jspdf.jsPDF;
            })
        ]).then(() => {
            window.libreriasPDFListas = true;
            window.mostrarToast('✅ Librerías PDF listas', '📄');
            if (loader) loader.style.display = 'none';
            if (window.usuarioActual && typeof window.initApp === 'function') {
                window.initApp();
            }
        }).catch(() => {
            window.mostrarToast('❌ No se pudieron cargar las librerías. Prueba con otro navegador.', '❌');
        });
    };

    // ============================================
    // ALMACENAMIENTO LOCAL
    // ============================================
    window.Storage = {
        get: function(key, defaultValue) {
            try { var data = localStorage.getItem('neto_' + key); return data ? JSON.parse(data) : defaultValue; }
            catch (e) { return defaultValue; }
        },
        set: function(key, value) {
            try { localStorage.setItem('neto_' + key, JSON.stringify(value)); }
            catch (e) { console.error('Error guardando:', e); }
        },
        remove: function(key) { localStorage.removeItem('neto_' + key); }
    };

    // ============================================
    // DATOS GLOBALES
    // ============================================
    window.datos = {
        promociones: window.Storage.get('promociones', []),
        caducidades: window.Storage.get('caducidades', []),
        ciclicos: window.Storage.get('ciclicos', []),
        inventario: window.Storage.get('inventario', []),
        aleatorios: window.Storage.get('aleatorios', [])
    };

    // ============================================
    // FUNCIONES DE PROMOCIONES
    // ============================================
    window.seleccionarEstilo = function(el, estilo) {
        document.querySelectorAll('.promo-card').forEach(function(card) {
            card.classList.remove('selected');
        });
        el.classList.add('selected');
        window.estiloSeleccionado = estilo;
    };

    window.generarPrompt = function() {
        var nombre = document.getElementById('prodNombre').value.trim();
        var precio = document.getElementById('prodPrecio').value.trim();
        var existencia = document.getElementById('prodExistencia').value.trim();
        var estilo = window.estiloSeleccionado || 'clasico';
        var perecedero = document.getElementById('checkPerecedero').checked;
        var vencimiento = document.getElementById('prodVencimiento').value;
        var fotoInput = document.getElementById('prodFoto');
        var fotoFile = fotoInput.files[0];

        if (!nombre || !precio) {
            window.mostrarToast('⚠️ Completa el nombre y precio', '⚠️');
            return;
        }

        var estilos = {
            'coca': 'Refrescante, con hielo y condensación, tonos rojos y blancos, ambiente veraniego',
            'botanero': 'Vibrante, colores cálidos, ambiente de fiesta, promoción 3x2',
            'frescura': 'Limpio, natural, tonos pastel, sensación de frescura',
            'estudio': 'Elegante, iluminación de estudio, fondo oscuro, producto destacado',
            'remate': 'Neón, colores eléctricos, ambiente de oferta relámpago',
            'clasico': 'Comercial clásico, iluminación suave, producto en centro'
        };

        var prompt = '📸 Imagen publicitaria para ' + nombre + '.\n';
        prompt += '🎨 Estilo: ' + (estilos[estilo] || estilos['clasico']) + '.\n';
        prompt += '💰 Promoción: ' + precio + '.\n';
        if (existencia) prompt += '📦 Disponible: ' + existencia + ' piezas.\n';
        if (perecedero && vencimiento) prompt += '🗓️ Fecha de caducidad: ' + vencimiento + '.\n';
        prompt += '🏪 Para tiendas NETO.';

        document.getElementById('promptResult').value = prompt;
        document.getElementById('outputSection').classList.remove('hidden');

        var promocion = {
            id: Date.now(),
            nombre: nombre,
            precio: precio,
            existencia: existencia,
            estilo: estilo,
            perecedero: perecedero,
            vencimiento: vencimiento,
            fecha: new Date().toISOString(),
            foto: fotoFile ? URL.createObjectURL(fotoFile) : null,
            prompt: prompt
        };

        window.datos.promociones.unshift(promocion);
        window.Storage.set('promociones', window.datos.promociones);
        window.actualizarBadges();
        window.renderizarPromociones();
        window.mostrarToast('✅ Prompt generado y promoción guardada', '✅');
    };

    window.copiarPrompt = function() {
        var textarea = document.getElementById('promptResult');
        textarea.select();
        document.execCommand('copy');
        window.mostrarToast('📋 Prompt copiado al portapapeles', '📋');
    };

    window.enviarWhatsApp = function() {
        var prompt = document.getElementById('promptResult').value;
        var url = 'https://wa.me/?text=' + encodeURIComponent(prompt);
        window.open(url, '_blank');
    };

    window.renderizarPromociones = function() {
        var lista = document.getElementById('promo-lista');
        var count = document.getElementById('promo-count');
        var items = window.datos.promociones || [];
        count.textContent = items.length;
        if (items.length === 0) {
            lista.innerHTML = '<p class="empty-message">No hay promociones guardadas</p>';
            return;
        }
        var html = '';
        items.forEach(function(p, i) {
            html += '<div class="list-item">';
            html += '  <div class="item-info">';
            html += '    <div class="item-name">' + p.nombre + '</div>';
            html += '    <div class="item-detail">💰 ' + p.precio + ' | 📦 ' + (p.existencia || 'N/A') + ' | 🎨 ' + (p.estilo || 'clasico') + '</div>';
            html += '  </div>';
            html += '  <div class="item-actions">';
            html += '    <button onclick="window.eliminarPromocion(' + i + ')" class="delete-btn"><i class="fas fa-trash"></i></button>';
            html += '  </div>';
            html += '</div>';
        });
        lista.innerHTML = html;
    };

    window.eliminarPromocion = function(index) {
        if (confirm('¿Eliminar esta promoción?')) {
            window.datos.promociones.splice(index, 1);
            window.Storage.set('promociones', window.datos.promociones);
            window.renderizarPromociones();
            window.actualizarBadges();
            window.mostrarToast('🗑️ Promoción eliminada', '🗑️');
        }
    };

    // ============================================
    // FUNCIONES DE CADUCIDADES
    // ============================================
    window.guardarCaducidad = function() {
        var codigo = document.getElementById('cad-codigo').value.trim();
        var nombre = document.getElementById('cad-nombre').value.trim();
        var fecha = document.getElementById('cad-fecha').value;
        var cantidad = parseInt(document.getElementById('cad-cantidad').value) || 1;
        var costo = parseFloat(document.getElementById('cad-costo').value) || 0;
        if (!codigo || !nombre || !fecha) {
            window.mostrarToast('⚠️ Completa todos los campos', '⚠️');
            return;
        }
        window.datos.caducidades.unshift({
            id: Date.now(),
            codigo: codigo,
            nombre: nombre,
            fecha: fecha,
            cantidad: cantidad,
            costo: costo,
            fechaRegistro: new Date().toISOString()
        });
        window.Storage.set('caducidades', window.datos.caducidades);
        document.getElementById('cad-codigo').value = '';
        document.getElementById('cad-nombre').value = '';
        document.getElementById('cad-fecha').value = '';
        document.getElementById('cad-cantidad').value = '1';
        document.getElementById('cad-costo').value = '0';
        window.renderizarCaducidades();
        window.renderizarCaducidadesDetalle();
        window.actualizarBadges();
        window.mostrarToast('✅ Producto registrado', '✅');
    };

    window.renderizarCaducidades = function() {
        var lista = document.getElementById('cad-lista');
        var count = document.getElementById('cad-count');
        var items = window.datos.caducidades || [];
        count.textContent = items.length;
        if (items.length === 0) {
            lista.innerHTML = '<p class="empty-message">No hay productos registrados</p>';
            document.getElementById('cad-resumen').style.display = 'none';
            return;
        }
        var html = '';
        var totalCosto = 0;
        items.forEach(function(p, i) {
            var costoTotal = (p.costo || 0) * (p.cantidad || 0);
            totalCosto += costoTotal;
            html += '<div class="list-item">';
            html += '  <div class="item-info">';
            html += '    <div class="item-name">' + p.nombre + '</div>';
            html += '    <div class="item-detail">📅 ' + p.fecha + ' | 📦 ' + p.cantidad + ' | 💰 $' + (p.costo || 0).toFixed(2) + ' | 🔢 ' + p.codigo + '</div>';
            html += '  </div>';
            html += '  <div class="item-actions">';
            html += '    <button onclick="window.eliminarCaducidad(' + i + ')" class="delete-btn"><i class="fas fa-trash"></i></button>';
            html += '  </div>';
            html += '</div>';
        });
        lista.innerHTML = html;
        var resumen = document.getElementById('cad-resumen');
        resumen.style.display = 'block';
        resumen.innerHTML = '<div class="fila"><span class="label">📦 Total Productos</span><span class="valor">' + items.length + '</span></div>' +
                            '<div class="fila"><span class="label">💰 Valor Total</span><span class="valor">$' + totalCosto.toFixed(2) + '</span></div>';
    };

    window.eliminarCaducidad = function(index) {
        if (confirm('¿Eliminar este producto?')) {
            window.datos.caducidades.splice(index, 1);
            window.Storage.set('caducidades', window.datos.caducidades);
            window.renderizarCaducidades();
            window.renderizarCaducidadesDetalle();
            window.actualizarBadges();
            window.mostrarToast('🗑️ Producto eliminado', '🗑️');

        if (confirm('¿Eliminar TODAS las caducidades?')) {
            window.datos.caducidades = [];
            window.Storage.set('caducidades', []);
            window.renderizarCaducidades();
            window.renderizarCaducidadesDetalle();
            window.actualizarBadges();
            window.mostrarToast('🗑️ Todas las caducidades eliminadas', '
